# Project-wide Gradle settings.
# 需要 JDK 17+（推荐 Android Studio 自带 JBR）。Gradle 9 / AGP 9.3 无法使用 JDK 8。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.java.home=D:\\Program Files\\Android\\Android Studio\\jbr
# org.gradle.parallel=true
# kapt 与 Configuration Cache 兼容性较差，组件化工程先关闭
org.gradle.configuration-cache=false
kotlin.code.style=official

android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false
android.builtInKotlin=false
android.newDsl=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

# true：各业务组件可独立运行；false：集成到宿主 App（与 MixApp 单工程运行方式对齐）
isBuildModule=false

